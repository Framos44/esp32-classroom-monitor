<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- chip pins -->
  <g stroke="#0ea5e9" stroke-width="8" stroke-linecap="round">
    <line x1="176" y1="120" x2="176" y2="80"/>
    <line x1="256" y1="120" x2="256" y2="80"/>
    <line x1="336" y1="120" x2="336" y2="80"/>

    <line x1="176" y1="392" x2="176" y2="432"/>
    <line x1="256" y1="392" x2="256" y2="432"/>
    <line x1="336" y1="392" x2="336" y2="432"/>

    <line x1="120" y1="176" x2="80" y2="176"/>
    <line x1="120" y1="256" x2="80" y2="256"/>
    <line x1="120" y1="336" x2="80" y2="336"/>

    <line x1="392" y1="176" x2="432" y2="176"/>
    <line x1="392" y1="256" x2="432" y2="256"/>
    <line x1="392" y1="336" x2="432" y2="336"/>
  </g>

  <!-- chip body -->
  <rect x="120" y="120" width="272" height="272" rx="28" fill="url(#chipGrad)"/>
  <rect x="120" y="120" width="272" height="272" rx="28" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.15"/>

  <!-- signal / sensor waves radiating from center, white on chip -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <circle cx="256" cy="256" r="10" fill="#ffffff" stroke="none"/>
    <path d="M232 256 A24 24 0 0 1 280 256" opacity="0.95"/>
    <path d="M214 256 A42 42 0 0 1 298 256" opacity="0.7"/>
    <path d="M196 256 A60 60 0 0 1 316 256" opacity="0.45"/>
  </g>

  <!-- small dot accents at chip corners -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="148" cy="148" r="5"/>
    <circle cx="364" cy="148" r="5"/>
    <circle cx="148" cy="364" r="5"/>
    <circle cx="364" cy="364" r="5"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="46" fill="#0f172a" letter-spacing="2">SIMAEP</text>
</svg>
